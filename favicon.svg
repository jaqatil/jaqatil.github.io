<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="hotpink"/>

  <!-- центральная S -->
  <text x="32" y="43" font-family="serif" font-size="36" font-weight="bold"
        fill="white" text-anchor="middle">S</text>

  <!-- e слева, по вертикальному центру S -->
  <text x="19" y="33" font-family="serif" font-size="11" font-weight="bold"
        fill="white" text-anchor="middle">e</text>

  <!-- a сверху, не касается S -->
  <text x="31.5" y="15" font-family="serif" font-size="11" font-weight="bold"
        fill="white" text-anchor="middle">a</text>

  <!-- o справа, зеркально e -->
  <text x="44.5" y="33" font-family="serif" font-size="11" font-weight="bold"
        fill="white" text-anchor="middle">o</text>

  <!-- impla снизу, симметрично a, уже S по ширине -->
  <text x="32" y="50" font-family="serif" font-size="6" font-weight="bold"
        fill="white" text-anchor="middle">impla</text>
</svg>