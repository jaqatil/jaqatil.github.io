<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудио плеер</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 24px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.playing {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
        }

        .status {
            color: white;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Аудио плеер</h1>
        <button id="playBtn">▶ Воспроизвести</button>
        <div class="status" id="status">Готов к воспроизведению</div>
    </div>

    <audio id="audioPlayer" src="smpla/1.m4a"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        playBtn.textContent = '⏸ Пауза';
                        playBtn.classList.add('playing');
                        status.textContent = 'Воспроизведение...';
                    })
                    .catch(err => {
                        status.textContent = 'Ошибка: ' + err.message;
                    });
            } else {
                audio.pause();
                playBtn.textContent = '▶ Воспроизвести';
                playBtn.classList.remove('playing');
                status.textContent = 'Пауза';
            }
        });

        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶ Воспроизвести';
            playBtn.classList.remove('playing');
            status.textContent = 'Воспроизведение завершено';
        });

        audio.addEventListener('error', () => {
            status.textContent = 'Не удалось загрузить файл smpla/1.m4a';
        });
    </script>
</body>
</html>
